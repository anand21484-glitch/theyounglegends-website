name: Website tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Static checks (pages, links, SEO, security)
        run: |
          pip install pytest
          python -m pytest tests -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Behaviour checks (forms, filters, legal, menu)
        working-directory: tests
        run: |
          npm install --no-audit --no-fund
          npm test
